name: Run Daily QQQ Trading Bot

on:
  schedule:
    - cron: '1 14 * * 1-5'  # 16:01
    - cron: '5 20 * * 1-5'  # 22:05
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install yfinance pandas numpy scikit-learn requests websockets

    - name: Generate Signal (16:01)
      if: github.event.schedule == '1 14 * * 1-5' || github.event_name == 'workflow_dispatch'
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        python data.py
        python live_bot.py

    - name: Evaluate Trade (22:05)
      if: github.event.schedule == '5 20 * * 1-5'
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        python close_bot.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "QQQ-Trading-Bot"
        git config --global user.email "bot@qqqtrade.com"
        git add virtual_balance.json today_trade.json || true
        git commit -m "Update account balance and trade logs [skip ci]" || true
        git push || true